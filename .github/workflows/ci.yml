name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signalgrid
          POSTGRES_PASSWORD: signalgrid
          POSTGRES_DB: signalgrid_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U signalgrid"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://signalgrid:signalgrid@localhost:5432/signalgrid_test
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # clippy --all-targets already type-checks the benches; building them
      # here would mean a full LTO release build on every run.
      - run: cargo test --workspace --locked

  python:
    name: Python (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [services/forecast, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.package }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  e2e:
    name: End-to-end (docker compose)
    # Independent of the other jobs, so it runs in parallel with them.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE: ci  # same code without LTO: much faster image builds
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: docker/setup-buildx-action@v3
      # One bake builds every image (the Rust builder stage is shared by all
      # three services), with layers cached across runs in the Actions cache.
      - uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      - run: docker compose up -d --no-build --wait --wait-timeout 120
      - run: python3 -u scripts/smoke_test.py
        timeout-minutes: 5
      - name: Service logs
        if: failure()
        run: docker compose logs --tail 200
      - if: always()
        run: docker compose down -v
