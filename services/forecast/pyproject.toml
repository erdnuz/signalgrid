[project]
name = "signalgrid-forecast"
version = "0.2.0"
description = "AR(1) forecasting, online evaluation and Markov-switching regime detection for SignalGrid"
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["signalgrid_forecast", "simulator"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["signalgrid_forecast"]

[[tool.mypy.overrides]]
module = ["scipy.*", "nats.*", "prometheus_client.*"]
ignore_missing_imports = true
