[workspace]
resolver = "2"
members = ["core", "pulse", "forge", "archive"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
signalgrid-core = { path = "core" }
anyhow = "1.0.100"
async-nats = "0.45.0"
bytes = "1.11.0"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
futures = "0.3.31"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false, features = ["http-listener"] }
rand = "0.9"
rand_distr = "0.5.1"
serde = { version = "1.0.184", features = ["derive"] }
serde_json = "1.0.104"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate"] }
tokio = { version = "1.36", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
warp = { version = "0.4.2", features = ["server"] }
proptest = "1.5"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

# Fast optimised build for CI images: same code paths, no LTO.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
