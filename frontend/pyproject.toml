[project]
name = "signalgrid-frontend"
version = "0.2.0"
description = "Live Dash dashboard for SignalGrid"
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["signalgrid_frontend", "helpers"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["signalgrid_frontend"]

[[tool.mypy.overrides]]
module = ["plotly.*", "dash.*", "nats.*", "requests.*"]
ignore_missing_imports = true
